name: Supabase keep-alive

# Supabase free-tier projects auto-pause after 7 days with zero API requests.
# This pings a lightweight health-check RPC every 24h so a quiet week never
# pauses production. See docs/spec/01-data-model-security-and-architecture.md §1.10.

on:
  schedule:
    - cron: "0 6 * * *" # every day at 06:00 UTC
  workflow_dispatch: {} # allows manually triggering from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health-check RPC
        run: |
          curl --fail --silent --show-error \
            -X POST "${{ secrets.SUPABASE_URL }}/rest/v1/rpc/health_check" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json"

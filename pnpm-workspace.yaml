packages:
  - 'apps/*'
  - 'packages/*'
nodeLinker: hoisted
overrides:
  '@babel/runtime': '^7.29.7'
  'expo-constants': '18.0.14'
allowBuilds:
  '@sentry/cli': true
  core-js: true
  detox: true
  dtrace-provider: true
  esbuild: true
  unrs-resolver: true
patchedDependencies:
  '@nozbe/watermelondb@0.28.0': patches/@nozbe__watermelondb@0.28.0.patch

project_id = "dala"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000", "http://localhost:3001"]
jwt_expiry = 3600
enable_signup = true

# Doc 01 §1.3.2 — email+password only. Magic link / OTP / social disabled.
[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

[auth.external.apple]
enabled = false
[auth.external.google]
enabled = false

[storage]
enabled = true
file_size_limit = "10MiB"

[analytics]
enabled = false

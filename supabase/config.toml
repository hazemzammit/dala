project_id = "dala"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

# export-org-data performs its own Authorization check internally (a forwarded
# owner/manager JWT, or a service-level key for the trusted internal call from
# apps/admin's export routes — either the exact legacy service-role JWT, or a
# new-format `sb_secret_` key the function validates against Auth's admin
# endpoint) — it never relied on the gateway's JWT verification anyway, which
# is why this override exists: the local gateway's verify_jwt rejects a
# `sb_secret_` Bearer value (it isn't a JWT) before the function even runs.
# Same per-function override shape as the functions above.
[functions.export-org-data]
verify_jwt = false

# Stripe (and later Konnect) call this endpoint from their own servers and cannot
# present a Supabase JWT, so the gateway JWT check would reject every real
# webhook. Authentication is the provider's signature, verified in
# _shared/stripeSignature.ts BEFORE the body is trusted (HMAC-SHA256 with
# STRIPE_WEBHOOK_SECRET, 5-minute replay window). Do not remove that check
# while this override is in place.
[functions.payment-webhook]
verify_jwt = false

# Resend delivers email events (bounces/complaints) from its own servers, also without a
# Supabase JWT. Authenticated by the Svix signature (svix-id/timestamp/signature, HMAC-SHA256,
# 5-minute replay window) verified in resend-webhook/index.ts before anything is parsed.
[functions.resend-webhook]
verify_jwt = false

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000", "http://localhost:3001"]
jwt_expiry = 3600
enable_signup = true

# Doc 01 §1.3.2 — email+password only. Magic link / OTP / social disabled.
[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

# Doc 01 §1.15 — TOTP two-factor authentication, built on Supabase Auth's
# native MFA (security-settings.tsx calls auth.mfa.enroll/challenge/verify
# directly — see that file's header for why this was chosen over a custom
# column). On hosted Supabase, MFA enrollment is a dashboard toggle that
# defaults on; the local CLI's Auth server defaults enroll/verify to OFF
# and only reads this from config.toml, so without this section
# `auth.mfa.enroll()` fails outright and every local build shows "Impossible
# de démarrer l'activation" the instant "Activer" is tapped — this has
# nothing to do with pgcrypto/search_path (see migration 0050's header for
# that separate bug); it's simply never been turned on for local dev.
[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

# Migration 0083 — enforces organizations.suspended_at/profiles.suspended_at
# (0021), which had documented "login blocked while set" intent since day
# one but no actual enforcement anywhere until this hook. Runs on every
# JWT mint (initial sign-in AND token refresh) via
# check_suspension_before_token_issuance (0083) — see that migration's own
# header for the full reasoning, including the disclosed residual-window
# tradeoff and why using this hook TYPE to reject (rather than its
# primary documented purpose of modifying claims) is a confirmed-uncertain,
# not live-tested, mechanism in this sandbox.
#
# Same "hosted vs. local CLI" gotcha as [auth.mfa] above: on HOSTED
# Supabase this additionally requires enabling the hook via the dashboard
# (Authentication → Hooks) — not expressible in this file alone.
[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/public/check_suspension_before_token_issuance"

[auth.external.apple]
enabled = false
[auth.external.google]
enabled = false

[storage]
enabled = true
file_size_limit = "10MiB"

[analytics]
enabled = false
